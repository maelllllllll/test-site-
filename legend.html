<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legend Edition — Goal Mystery Pack</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --crimson: #B91C1C;
    --navy: #0F172A;
    --gold: #F59E0B;
    --white: #FFFFFF;
    --purple: #9333EA;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: #000;
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
  }

  a { text-decoration: none; color: inherit; }

  /* ── TOP NAV ── */
  .top-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .top-nav .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 2px;
  }

  .top-nav .logo .red { color: var(--crimson); }

  .top-nav .back-link {
    font-size: 14px;
    color: rgba(255,255,255,0.55);
    transition: color 0.3s;
  }

  .top-nav .back-link:hover { color: var(--white); }

  /* ── HERO ── */
  .legend-hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 100px 20px 60px;
    background: radial-gradient(ellipse at center, rgba(147,51,234,0.15) 0%, #000 70%);
  }

  .legend-wrap {
    width: 100%;
    max-width: 1100px;
    text-align: center;
  }

  .legend-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 4px;
    color: #C084FC;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .legend-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(44px, 7vw, 84px);
    letter-spacing: -1px;
    text-transform: uppercase;
    margin-bottom: 12px;
    line-height: 1;
  }

  .legend-sub {
    color: rgba(255,255,255,0.6);
    font-size: 17px;
    max-width: 620px;
    margin: 0 auto 36px;
    line-height: 1.6;
  }

  .video-shell {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(192,132,252,0.25);
    box-shadow: 0 30px 90px rgba(0,0,0,0.7), 0 0 80px rgba(147,51,234,0.25);
    aspect-ratio: 16 / 9;
    background: #000;
  }

  .video-shell video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }

  .unmute-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.35);
    cursor: pointer;
    transition: opacity 0.3s;
  }

  .unmute-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .unmute-btn {
    background: rgba(147,51,234,0.9);
    color: var(--white);
    border: 2px solid rgba(255,255,255,0.2);
    padding: 16px 32px;
    border-radius: 999px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 10px 40px rgba(147,51,234,0.4);
    transition: transform 0.2s, background 0.2s;
  }

  .unmute-btn:hover {
    transform: scale(1.05);
    background: rgba(147,51,234,1);
  }

  .back-cta {
    display: inline-block;
    margin-top: 32px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.55);
    padding: 12px 28px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    transition: color 0.3s, border-color 0.3s;
  }

  .back-cta:hover {
    color: var(--white);
    border-color: rgba(255,255,255,0.4);
  }

  footer {
    background: #060A13;
    padding: 24px 20px;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<nav class="top-nav">
  <a href="index.html" class="logo">GOAL <span class="red">MYSTERY PACK</span></a>
  <a href="products.html#premium" class="back-link">← Back to packs</a>
</nav>

<section class="legend-hero">
  <div class="legend-wrap">
    <div class="legend-label">Ultra Rare · 79€</div>
    <h1 class="legend-title">Legend Edition</h1>
    <p class="legend-sub">A mystery pack curated around football's greatest icons. Each jersey is tied to a legendary player era — from the 90s golden age to the modern GOAT debate.</p>

    <div class="video-shell">
      <video id="legendVideo" autoplay playsinline preload="auto" controls>
        <source src="legend-video.mp4" type="video/mp4">
      </video>
      <div class="unmute-overlay" id="unmuteOverlay">
        <button class="unmute-btn" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
          Click to play with sound
        </button>
      </div>
    </div>

    <a href="products.html#premium" class="back-cta">Back to packs</a>
  </div>
</section>

<footer>
  © 2026 Goal Mystery Pack — All rights reserved
</footer>

<script>
  const video = document.getElementById('legendVideo');
  const overlay = document.getElementById('unmuteOverlay');

  // Try to autoplay with sound. If the browser blocks it, show the overlay
  // so the user can start playback with sound via a single click.
  async function tryAutoplayWithSound() {
    video.muted = false;
    video.volume = 1;
    try {
      await video.play();
      overlay.classList.add('hidden');
    } catch (err) {
      // Autoplay with sound blocked — wait for user gesture.
      overlay.classList.remove('hidden');
    }
  }

  overlay.addEventListener('click', async () => {
    video.muted = false;
    video.volume = 1;
    try {
      await video.play();
    } catch (e) {}
    overlay.classList.add('hidden');
  });

  window.addEventListener('DOMContentLoaded', tryAutoplayWithSound);
</script>

</body>
</html>
